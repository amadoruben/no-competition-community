name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PG: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration (embedded PGlite)
        run: npm test
      - name: Unit + integration (PostgreSQL 16)
        run: |
          psql -h localhost -U postgres -c "create database ncc_test"
          TEST_DATABASE_URL=$PG/ncc_test npm test
      - name: Migrations on a clean database (twice, idempotent)
        run: |
          psql -h localhost -U postgres -c "create database ncc_clean"
          DATABASE_URL=$PG/ncc_clean npm run db:migrate
          DATABASE_URL=$PG/ncc_clean npm run db:migrate
      - name: Export → restore → verify
        run: |
          psql -h localhost -U postgres -c "create database ncc_src" -c "create database ncc_dst"
          DATABASE_URL=$PG/ncc_src npm run db:seed
          DATABASE_URL=$PG/ncc_src npm run db:export -- --out backups/ci.json
          DATABASE_URL=$PG/ncc_dst npm run db:import -- backups/ci.json
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (production build, PostgreSQL)
        run: |
          psql -h localhost -U postgres -c "create database ncc_e2e"
          E2E_DATABASE_URL=$PG/ncc_e2e npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
